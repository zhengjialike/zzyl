# 应用服务 WEB 访问端口
server.port=8080

# mysql数据库连接
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/zzyl
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

# mybatisplus
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.mapper-locations=classpath:/mapper/*.xml

# 阿里云 OSS
aliyun.oss.endpoint=https://oss-cn-beijing.aliyuncs.com
aliyun.oss.bucketName=zzyl-oss-zj
aliyun.oss.region=cn-beijing

# Jackson 日期时间格式化配置（解决 LocalDateTime 反序列化问题）
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.jackson.serialization.write-dates-as-timestamps=false

# DashScope（保留以供自动配置通过）
spring.ai.dashscope.api-key=placeholder

# DeepSeek 大模型调用配置（直接 HTTP 调用）
deepseek.api-key=YOUR_DEEPSEEK_API_KEY
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-chat


# 本地文件上传目录(当OSS不可用时回退使用)
upload.local-dir=D:/zzyl-uploads
upload.url-prefix=http://localhost:8080/uploads

# 文件上传大小限制(单文件最大100MB,总请求最大200MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=0